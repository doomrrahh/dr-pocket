name: Build iOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project DrPocket.xcodeproj \
            -scheme DrPocket \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      # An unsigned .ipa is just a zip with the .app inside a Payload folder.
      # Sideloading tools (AltStore, SideStore, Sideloadly) sign it on the way in.
      - name: Package IPA
        working-directory: ios/build/Build/Products/Release-iphoneos
        run: |
          mkdir -p Payload
          cp -R DrPocket.app Payload/
          zip -qry DrPocket.ipa Payload
          ls -lh DrPocket.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrPocket-ipa
          path: ios/build/Build/Products/Release-iphoneos/DrPocket.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/build/Build/Products/Release-iphoneos/DrPocket.ipa
          generate_release_notes: true
          body: |
            ## Install

            This build is **unsigned**, so you sign it yourself with a free Apple ID.
            No paid developer account is needed.

            **On a Mac or Windows PC:** use [Sideloadly](https://sideloadly.io) or
            [AltStore](https://altstore.io) — plug in your iPhone, drop in `DrPocket.ipa`,
            enter your Apple ID.

            **On the iPhone alone:** use [SideStore](https://sidestore.io).

            A free Apple ID signature lasts 7 days, so the app needs refreshing weekly.
            AltStore and SideStore do that automatically over Wi-Fi.

            After the first launch, go to **Settings → General → VPN & Device Management**
            and trust your developer certificate.
