<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dr. Pocket</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--glass:rgba(255,255,255,.045);--edge:rgba(255,255,255,.08);--fg:#eef2ff;--mute:#8a93a8;
--ok:#34d399;--hi:#fbbf24;--lo:#f87171;--acc:#818cf8;--acc2:#22d3ee;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;z-index:-1;animation:float 18s var(--ease) infinite alternate}
.b1{width:520px;height:520px;background:#4f46e5;top:-160px;left:-120px}
.b2{width:460px;height:460px;background:#0891b2;bottom:-180px;right:-100px;animation-delay:-6s}
.b3{width:300px;height:300px;background:var(--glow,#10b981);top:30%;left:45%;opacity:.18;transition:background 1.2s;animation-delay:-12s}
@keyframes float{to{transform:translate(60px,40px) scale(1.15)}}
header{display:flex;align-items:center;gap:14px;padding:22px clamp(16px,4vw,40px);position:sticky;top:0;z-index:5;
backdrop-filter:blur(18px);background:rgba(7,9,15,.55);border-bottom:1px solid var(--edge)}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-style:normal;font-size:16px;box-shadow:0 0 24px rgba(129,140,248,.5)}
.seg{display:flex;background:var(--glass);border:1px solid var(--edge);border-radius:12px;padding:3px;position:relative;margin-left:auto}
.seg button{background:none;border:0;color:var(--mute);padding:6px 14px;border-radius:9px;cursor:pointer;font:500 13px Inter;position:relative;z-index:1;transition:color .3s}
.seg button.on{color:var(--fg)}
.seg .pill{position:absolute;top:3px;bottom:3px;border-radius:9px;background:rgba(255,255,255,.1);transition:all .45s var(--ease)}
.btn{background:var(--glass);border:1px solid var(--edge);color:var(--fg);padding:8px 14px;border-radius:12px;cursor:pointer;font:500 13px Inter;transition:all .3s var(--ease);text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.btn.spin svg{animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
#stat{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 2s infinite;flex:none}
.dot.err{background:var(--lo);box-shadow:0 0 10px var(--lo)}
@keyframes pulse{50%{opacity:.35}}
main{max-width:1200px;margin:auto;padding:28px clamp(16px,4vw,40px) 60px;display:grid;gap:18px;grid-template-columns:1.3fr 1fr 1fr}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:22px;padding:22px;backdrop-filter:blur(20px);
opacity:0;transform:translateY(24px);animation:in .9s var(--ease) forwards;transition:transform .4s var(--ease),border-color .4s}
.card:hover{border-color:rgba(255,255,255,.16)}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}.card:nth-child(4){animation-delay:.24s}.card:nth-child(5){animation-delay:.32s}
@keyframes in{to{opacity:1;transform:none}}
.wide{grid-column:1/-1}
.lbl{color:var(--mute);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.hero{display:flex;align-items:center;gap:22px}
.orb{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.orb::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--c,var(--ok)),transparent 70%,var(--c,var(--ok)));
animation:rot 6s linear infinite;-webkit-mask:radial-gradient(circle,transparent 66%,#000 67%);mask:radial-gradient(circle,transparent 66%,#000 67%)}
.orb::after{content:"";position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.08),transparent 70%);box-shadow:0 0 60px -10px var(--c,var(--ok));transition:box-shadow 1s}
.num{font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1;z-index:1;text-align:center;transition:color 1s}
.num small{display:block;font-size:11px;font-weight:500;color:var(--mute);letter-spacing:.05em;margin-top:4px}
.arr{font-size:34px;display:inline-block;transition:transform .8s var(--ease),color 1s}
.meta div{color:var(--mute);font-size:14px;margin-top:4px}.meta b{color:var(--fg);font-weight:600}
.ringwrap{display:flex;align-items:center;gap:20px}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round;stroke-dasharray:0 999;transition:stroke-dasharray 1.4s var(--ease),stroke-dashoffset 1.4s var(--ease)}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin:6px 0}.legend b{color:var(--fg);margin-left:auto;padding-left:10px}
.legend i{width:8px;height:8px;border-radius:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat .v{font-size:24px;font-weight:700;letter-spacing:-.02em}.stat .k{font-size:12px;color:var(--mute)}
.chartwrap{position:relative;height:340px}canvas{width:100%;height:100%;display:block}
#tip{position:absolute;pointer-events:none;background:rgba(15,18,28,.9);border:1px solid var(--edge);padding:8px 12px;border-radius:10px;font-size:13px;
opacity:0;transform:translate(-50%,-120%) scale(.9);transition:opacity .2s,transform .25s var(--ease),left .15s var(--ease),top .15s var(--ease);white-space:nowrap;backdrop-filter:blur(8px)}
#tip.on{opacity:1;transform:translate(-50%,-130%) scale(1)}
form{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input,select{background:rgba(255,255,255,.04);border:1px solid var(--edge);color:var(--fg);padding:10px 14px;border-radius:12px;font:14px Inter;outline:none;transition:all .3s var(--ease)}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(129,140,248,.15)}
input{width:120px}select option{background:#111}
.go{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff;font-weight:600;padding:10px 20px}
.go:hover{box-shadow:0 8px 24px -6px rgba(129,140,248,.6)}
.tx{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;margin-top:6px;background:rgba(255,255,255,.025);animation:in .6s var(--ease) both;opacity:0;transform:translateY(10px);transition:all .4s var(--ease)}
.tx.out{opacity:0!important;transform:translateX(40px)!important}
.tx .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:rgba(129,140,248,.15);flex:none}
.tx .t{font-size:12px;color:var(--mute)}.tx .x{margin-left:auto;background:none;border:0;color:var(--mute);cursor:pointer;font-size:18px;opacity:0;transition:opacity .2s}
.tx:hover .x{opacity:1}.chip{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.07)}
.empty{color:var(--mute);font-size:14px;padding:10px 0}
.banner{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 20px;border-radius:18px;
background:linear-gradient(120deg,rgba(248,113,113,.12),rgba(129,140,248,.1));border:1px solid rgba(248,113,113,.28);animation:in .7s var(--ease) both}
.banner b{font-weight:600}.banner .g{flex:1;min-width:220px;font-size:13px;color:var(--mute)}
.banner input{flex:2;min-width:240px;width:auto;font:13px ui-monospace,monospace}
details.how{grid-column:1/-1;font-size:13px;color:var(--mute)}
details.how summary{cursor:pointer;padding:6px 0;color:var(--acc)}
details.how ol{margin:6px 0 0;padding-left:20px;line-height:1.9}details.how code{background:rgba(255,255,255,.07);padding:2px 6px;border-radius:6px;font-size:12px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pills b{font-weight:600;color:var(--fg)}
.pill2{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mute);background:rgba(255,255,255,.04);border:1px solid var(--edge);padding:7px 12px;border-radius:99px}
@media(max-width:900px){main{grid-template-columns:1fr}.hero{flex-direction:column;text-align:center}header{flex-wrap:wrap}.seg{margin-left:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card,.tx{opacity:1;transform:none}}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3" id="glow"></div>
<header><div class="logo"><i>✚</i>Dr. Pocket</div>
<div class="seg" id="seg"><span class="pill"></span><button data-h="3">3h</button><button data-h="6">6h</button><button data-h="12">12h</button><button data-h="24" class="on">24h</button></div>
<button class="btn" id="sync"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>Sync</button>
<a class="btn" href="/api/export">Export</a><span id="stat"><span class="dot"></span>…</span></header>
<main>
<div id="banner"></div>
<div class="card"><div class="lbl">Now</div><div class="hero">
<div class="orb" id="orb"><div class="num"><span id="bg">--</span><small>mg/dL</small></div></div>
<div class="meta"><span class="arr" id="arr">→</span><div id="ago">waiting for data</div><div id="delta"></div></div></div></div>
<div class="card"><div class="lbl">Time in range</div><div class="ringwrap">
<svg class="ring" width="120" height="120" viewBox="0 0 120 120" style="transform:rotate(-90deg)">
<circle cx="60" cy="60" r="48" stroke="rgba(255,255,255,.06)" style="stroke-dasharray:none"/><circle id="rhi" cx="60" cy="60" r="48" stroke="var(--hi)"/>
<circle id="rok" cx="60" cy="60" r="48" stroke="var(--ok)"/><circle id="rlo" cx="60" cy="60" r="48" stroke="var(--lo)"/></svg>
<div class="legend"><div><i style="background:var(--ok)"></i>In range<b id="pok">0%</b></div><div><i style="background:var(--hi)"></i>High<b id="phi">0%</b></div><div><i style="background:var(--lo)"></i>Low<b id="plo">0%</b></div></div></div></div>
<div class="card"><div class="lbl">Stats</div><div class="grid2">
<div class="stat"><div class="v" id="avg">--</div><div class="k">Average</div></div>
<div class="stat"><div class="v" id="gmi">--</div><div class="k">GMI (est. A1c)</div></div>
<div class="stat"><div class="v" id="cv">--</div><div class="k">Variability (CV)</div></div>
<div class="stat"><div class="v" id="ins">--</div><div class="k">Insulin · Carbs</div></div></div></div>
<div class="card wide" id="devcard" style="display:none"><div class="lbl">Pump &amp; sensor</div><div class="pills" id="dev"></div></div>
<div class="card wide"><div class="lbl">Glucose</div><div class="chartwrap"><canvas id="c"></canvas><div id="tip"></div></div></div>
<div class="card wide"><div class="lbl">Log</div>
<form id="tf"><select name="eventType"><option>Meal Bolus</option><option>Correction Bolus</option><option>Carb Correction</option><option>Exercise</option><option>Note</option></select>
<input name="insulin" type="number" step="0.05" placeholder="Insulin (U)"><input name="carbs" type="number" placeholder="Carbs (g)">
<input name="notes" placeholder="Notes" style="flex:1;min-width:160px"><button class="btn go">Add entry</button></form><div id="tt"></div></div>
</main>
<script>
const ARROWS={DoubleUp:['⇉',-90],SingleUp:['→',-90],FortyFiveUp:['→',-45],Flat:['→',0],FortyFiveDown:['→',45],SingleDown:['→',90],DoubleDown:['⇉',90]};
const ICON={'Meal Bolus':'🍽','Correction Bolus':'💉','Carb Correction':'🍬','Exercise':'🏃','Note':'📝'};
let LOW=70,HIGH=180,HRS=24,E=[],T=[],anim=1,hover=null,pts=[];
const $=id=>document.getElementById(id),C=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const tone=v=>v<LOW?'--lo':v>HIGH?'--hi':'--ok';
function tween(el,to,fmt=v=>Math.round(v),dur=1100){const from=parseFloat(el.dataset.v)||0;el.dataset.v=to;const s=performance.now();
  (function f(n){const p=Math.min(1,(n-s)/dur),e=1-Math.pow(1-p,4);el.textContent=fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(f)})(s)}
function seg(){const b=document.querySelector('#seg .on'),p=document.querySelector('#seg .pill');p.style.left=b.offsetLeft+'px';p.style.width=b.offsetWidth+'px'}
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#seg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');HRS=+b.dataset.h;seg();load(true)});
async function load(re){
  const st=await fetch('/api/status').then(r=>r.json());LOW=st.thresholds.low;HIGH=st.thresholds.high;
  const err=st.lastError;
  $('stat').innerHTML=`<span class="dot ${err?'err':''}"></span>`+esc(err||(st.lastSync?(st.provider==='demo'?'Demo · ':'Live · ')+new Date(st.lastSync).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'Connecting…'));
  banner(st);
  const d=st.device||{},bits=[];
  if(d.pumpBattery!=null)bits.push(['🔋','Pump battery',d.pumpBattery+'%']);
  if(d.reservoir!=null)bits.push(['💧','Reservoir',(+d.reservoir).toFixed(1)+' U']);
  if(d.activeInsulin!=null)bits.push(['⏳','Active insulin',(+d.activeInsulin).toFixed(2)+' U']);
  if(d.sensorHours!=null)bits.push(['📡','Sensor',d.sensorHours+' h left']);
  $('devcard').style.display=bits.length?'':'none';
  $('dev').innerHTML=bits.map(([i,k,v])=>`<span class="pill2">${i} ${k} <b>${esc(v)}</b></span>`).join('');
  const since=Date.now()-HRS*36e5;
  [E,T]=await Promise.all([fetch('/api/v1/entries.json?count=3000&since='+since).then(r=>r.json()),fetch('/api/v1/treatments.json?since='+since).then(r=>r.json())]);
  render();if(re)anim=0;
}
function render(){
  const cur=E[0];
  if(cur){tween($('bg'),cur.sgv);const c=C(tone(cur.sgv));$('orb').style.setProperty('--c',c);$('glow').style.setProperty('--glow',c);$('bg').style.color=c;
    const [a,r]=ARROWS[cur.direction]||['•',0];$('arr').textContent=a;$('arr').style.transform=`rotate(${r}deg)`;$('arr').style.color=c;
    const m=Math.round((Date.now()-cur.date)/6e4);$('ago').innerHTML=`<b>${m}</b> min ago${m>15?' · stale':''}`;
    const d=E[1]?cur.sgv-E[1].sgv:0;$('delta').innerHTML=E[1]?`<b>${d>=0?'+':''}${d}</b> since last`:''}
  const n=E.length||1,lo=E.filter(e=>e.sgv<LOW).length/n,hi=E.filter(e=>e.sgv>HIGH).length/n,ok=E.length?1-lo-hi:0,L=2*Math.PI*48;
  const arc=(el,frac,off)=>{el.style.strokeDasharray=`${Math.max(0,frac*L-(frac>.03?8:0))} ${L}`;el.style.strokeDashoffset=-off*L};
  arc($('rok'),ok,0);arc($('rhi'),hi,ok);arc($('rlo'),lo,ok+hi);
  tween($('pok'),ok*100,v=>Math.round(v)+'%');tween($('phi'),hi*100,v=>Math.round(v)+'%');tween($('plo'),lo*100,v=>Math.round(v)+'%');
  const v=E.map(e=>e.sgv),avg=v.reduce((a,b)=>a+b,0)/(v.length||1),sd=Math.sqrt(v.reduce((a,b)=>a+(b-avg)**2,0)/(v.length||1));
  if(v.length){tween($('avg'),avg);tween($('gmi'),3.31+.02392*avg,x=>x.toFixed(1)+'%');tween($('cv'),sd/avg*100,x=>Math.round(x)+'%')}
  $('ins').textContent=`${T.reduce((a,t)=>a+(t.insulin||0),0).toFixed(1)}U · ${T.reduce((a,t)=>a+(t.carbs||0),0)}g`;
  $('tt').innerHTML=T.length?T.map((t,i)=>`<div class="tx" style="animation-delay:${i*.04}s" id="x${t._id}"><div class="ic">${ICON[t.eventType]||'•'}</div>
    <div><div>${esc(t.eventType)}${t.notes?' · '+esc(t.notes):''}</div><div class="t">${new Date(t.date).toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'})}</div></div>
    ${t.insulin?`<span class="chip">${t.insulin} U</span>`:''}${t.carbs?`<span class="chip">${t.carbs} g</span>`:''}<button class="x" onclick="del('${t._id}')">×</button></div>`).join(''):'<div class="empty">Nothing logged yet.</div>';
}
function banner(st){
  const need=!st.signedIn||st.lastError;
  const b=$('banner');
  if(!need){b.innerHTML='';b.dataset.on='';return}
  if(b.dataset.on==='1')return;b.dataset.on='1';
  b.innerHTML=`<div class="banner"><div class="g"><b>${st.signedIn?'CareLink session ended':'Showing demo data'}</b><br>
    Sign in to CareLink to pull your real pump and sensor data.</div>
    <select id="rg"><option value="US">United States</option><option value="EU">Europe</option></select>
    <button class="btn go" id="go1">Sign in to CareLink</button></div>
  <div id="step2"></div>`;
  $('go1').onclick=async()=>{
    const r=await fetch('/api/carelink/authorize?region='+$('rg').value).then(r=>r.json());
    window.open(r.url,'_blank','noopener');
    $('step2').innerHTML=`<div class="banner" style="border-color:rgba(129,140,248,.35)">
      <div class="g"><b>Almost there</b><br>Sign in in the tab that just opened. When the page fails to load
      (it redirects to <code>com.medtronic.carepartner:/sso…</code>), copy that whole address and paste it here.</div>
      <input id="cb" placeholder="com.medtronic.carepartner:/sso?code=…" autocomplete="off">
      <button class="btn go" id="go2">Finish</button></div>`;
    $('cb').focus();
    $('cb').onkeydown=e=>{if(e.key==='Enter')$('go2').click()};
    $('go2').onclick=async()=>{
      const v=$('cb').value.trim();if(!v)return;
      $('go2').textContent='Connecting…';
      const r=await fetch('/api/carelink/callback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:v})}).then(r=>r.json());
      if(r.ok){b.dataset.on='';b.innerHTML=''}
      else{$('go2').textContent='Finish';$('step2').insertAdjacentHTML('beforeend',`<div class="how" style="color:var(--lo);padding:8px 4px">${esc(r.error||r.lastError)}</div>`)}
      load(true)};
  };
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function draw(){
  const c=$('c'),d=devicePixelRatio,W=c.clientWidth,H=c.clientHeight;if(c.width!==W*d||c.height!==H*d){c.width=W*d;c.height=H*d}
  const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,W,H);
  const L=40,B=26,t1=Date.now(),t0=t1-HRS*36e5,ymax=Math.max(300,...E.map(e=>e.sgv))+20;
  const x=t=>L+(t-t0)/(t1-t0)*(W-L-12),y=v=>H-B-v/ymax*(H-B-12),ease=1-Math.pow(1-anim,3);
  const band=g.createLinearGradient(0,y(HIGH),0,y(LOW));band.addColorStop(0,'rgba(52,211,153,.08)');band.addColorStop(1,'rgba(52,211,153,.02)');
  g.fillStyle=band;g.fillRect(L,y(HIGH),W-L,y(LOW)-y(HIGH));
  g.font='500 11px Inter,system-ui';g.fillStyle=C('--mute');g.setLineDash([3,5]);g.strokeStyle='rgba(255,255,255,.08)';
  for(const v of [LOW,HIGH,250]){g.beginPath();g.moveTo(L,y(v));g.lineTo(W,y(v));g.stroke();g.fillText(v,6,y(v)+4)}g.setLineDash([]);
  const step=HRS>6?3:1;g.textAlign='center';for(let h=Math.ceil(t0/36e5/step)*step;h*36e5<t1;h+=step)g.fillText(new Date(h*36e5).toLocaleTimeString([],{hour:'numeric'}),x(h*36e5),H-6);g.textAlign='left';
  pts=[...E].reverse().map(e=>({X:x(e.date),Y:y(e.sgv),e}));
  g.save();g.beginPath();g.rect(0,0,L+(W-L)*ease,H);g.clip();
  if(pts.length>1){
    const gap=20*6e4/(t1-t0)*(W-L);
    const path=()=>{g.moveTo(pts[0].X,pts[0].Y);for(let i=1;i<pts.length;i++){const p=pts[i-1],q=pts[i],mx=(p.X+q.X)/2;
      if(q.X-p.X>gap){g.moveTo(q.X,q.Y);continue}g.bezierCurveTo(mx,p.Y,mx,q.Y,q.X,q.Y)}};
    const area=g.createLinearGradient(0,0,0,H);area.addColorStop(0,'rgba(129,140,248,.28)');area.addColorStop(1,'rgba(129,140,248,0)');
    g.beginPath();path();g.lineTo(pts.at(-1).X,H-B);g.lineTo(pts[0].X,H-B);g.closePath();g.fillStyle=area;g.fill();
    const line=g.createLinearGradient(0,y(ymax),0,y(0)),s=v=>Math.max(0,Math.min(1,1-v/ymax));
    line.addColorStop(0,C('--hi'));line.addColorStop(s(HIGH),C('--hi'));line.addColorStop(s(HIGH)+.001,C('--ok'));
    line.addColorStop(s(LOW),C('--ok'));line.addColorStop(s(LOW)+.001,C('--lo'));line.addColorStop(1,C('--lo'));
    g.beginPath();path();g.lineWidth=2.5;g.lineJoin='round';g.strokeStyle=line;g.shadowColor='rgba(129,140,248,.6)';g.shadowBlur=14;g.stroke();g.shadowBlur=0}
  for(const t of T){const X=x(t.date);g.strokeStyle='rgba(34,211,238,.35)';g.setLineDash([2,4]);g.beginPath();g.moveTo(X,14);g.lineTo(X,H-B);g.stroke();g.setLineDash([]);
    g.fillStyle=C('--acc2');g.beginPath();g.arc(X,14,4,0,7);g.fill();g.fillText((ICON[t.eventType]||'')+' '+(t.insulin?t.insulin+'U ':'')+(t.carbs?t.carbs+'g':''),X+8,18)}
  g.restore();
  const last=pts.at(-1);if(last&&anim>=1){const r=4+Math.sin(performance.now()/300)*2;g.fillStyle=C(tone(last.e.sgv));
    g.globalAlpha=.25;g.beginPath();g.arc(last.X,last.Y,r*2.2,0,7);g.fill();g.globalAlpha=1;g.beginPath();g.arc(last.X,last.Y,4.5,0,7);g.fill()}
  if(hover){g.strokeStyle='rgba(255,255,255,.2)';g.beginPath();g.moveTo(hover.X,12);g.lineTo(hover.X,H-B);g.stroke();
    g.fillStyle='#fff';g.beginPath();g.arc(hover.X,hover.Y,5,0,7);g.fill();g.fillStyle=C(tone(hover.e.sgv));g.beginPath();g.arc(hover.X,hover.Y,3,0,7);g.fill()}
}
(function loop(){if(anim<1)anim=Math.min(1,anim+.018);draw();requestAnimationFrame(loop)})();
$('c').onmousemove=e=>{const r=e.target.getBoundingClientRect(),mx=e.clientX-r.left;let best=null;for(const p of pts)if(!best||Math.abs(p.X-mx)<Math.abs(best.X-mx))best=p;
  hover=best;const tip=$('tip');if(!best)return;tip.style.left=best.X+'px';tip.style.top=best.Y+'px';tip.classList.add('on');
  tip.innerHTML=`<b style="color:${C(tone(best.e.sgv))}">${best.e.sgv}</b> mg/dL · ${new Date(best.e.date).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}`};
$('c').onmouseleave=()=>{hover=null;$('tip').classList.remove('on')};
async function del(id){const el=$('x'+id);el&&el.classList.add('out');await fetch('/api/v1/treatments?id='+id,{method:'DELETE'});setTimeout(()=>load(false),350)}
$('tf').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  await fetch('/api/v1/treatments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(f)});e.target.reset();load(false)};
$('sync').onclick=async()=>{$('sync').classList.add('spin');await fetch('/api/sync',{method:'POST'});$('sync').classList.remove('spin');load(true)};
onresize=seg;seg();load(true);setInterval(()=>load(false),60e3);
</script></body></html>
